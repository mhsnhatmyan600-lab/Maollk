<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داروخانه آنلاین | فروشگاه محصولات دارویی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f8f9fa; color: #333; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .modal-bg { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <!-- هدر -->
    <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <div class="text-red-600 font-black text-2xl flex items-center gap-2">
                    <i class="fa-solid fa-pills"></i> داروخانه
                </div>
            </div>
            <div class="flex-1 max-w-2xl relative hidden sm:block">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="جستجوی دارو یا محصول..." 
                       class="w-full bg-gray-100 border-none rounded-full py-2 pr-11 pl-4 text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 transition">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-3 text-gray-400"></i>
            </div>
            <button onclick="toggleCart()" class="relative bg-gray-100 hover:bg-gray-200 p-2.5 rounded-full text-gray-700 transition">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
                <span id="cartBadge" class="hidden absolute -top-1 -right-1 bg-red-600 text-white text-xs font-bold w-5 h-5 rounded-full items-center justify-center">0</span>
            </button>
        </div>
    </header>

    <!-- بنر بالای صفحه -->
    <section class="max-w-7xl mx-auto px-4 py-6 w-full">
        <div class="bg-gradient-to-l from-red-600 to-red-500 rounded-3xl p-8 sm:p-12 text-white flex flex-col md:flex-row items-center justify-between shadow-xl">
            <div class="space-y-3 text-center md:text-right mb-4 md:mb-0">
                <span class="bg-white/20 text-xs px-3 py-1 rounded-full font-bold">داروخانه آنلاین</span>
                <h1 class="text-2xl sm:text-4xl font-black">سلامتی شما، هدف ماست</h1>
                <p class="text-red-100 text-sm">خرید آسان و مطمئن محصولات دارویی و بهداشتی</p>
            </div>
            <i class="fa-solid fa-prescription-bottle-medical text-7xl sm:text-9xl text-white/30"></i>
        </div>
    </section>

    <!-- محصولات -->
    <main class="max-w-7xl mx-auto px-4 py-4 flex-1 w-full">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800 border-r-4 border-red-600 pr-3">محصولات پرفروش</h2>
        </div>
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6"></div>
    </main>

    <!-- سبد خرید -->
    <div id="cartDrawer" class="fixed inset-0 z-50 invisible transition-all duration-300">
        <div id="cartOverlay" onclick="toggleCart()" class="absolute inset-0 bg-black/50 opacity-0 transition-opacity duration-300"></div>
        <div class="absolute inset-y-0 left-0 max-w-full w-80 bg-white shadow-2xl flex flex-col transform -translate-x-full transition-transform duration-300" id="cartPanel">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold flex items-center gap-2"><i class="fa-solid fa-basket-shopping text-red-600"></i> سبد خرید</h3>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-red-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
            <div class="p-4 border-t bg-gray-50 space-y-3">
                <div class="flex justify-between font-bold"><span>جمع کل:</span><span id="cartTotalPrice" class="text-red-600">۰ تومان</span></div>
                <button onclick="openCheckout()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-md">ادامه و ثبت سفارش</button>
            </div>
        </div>
    </div>

    <!-- مودال تکمیل سفارش (ارسال به شماره) -->
    <div id="checkoutModal" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-bg p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
            <button onclick="closeCheckout()" class="absolute top-4 left-4 text-gray-400 hover:text-red-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div class="text-center mb-6">
                <i class="fa-solid fa-truck-fast text-4xl text-red-600 mb-3"></i>
                <h3 class="text-xl font-bold text-gray-800">تکمیل اطلاعات ارسال</h3>
                <p class="text-sm text-gray-500 mt-1">لطفاً اطلاعات خود را وارد کنید تا سفارش شما ثبت شود.</p>
            </div>
            <form onsubmit="submitOrder(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">نام و نام خانوادگی</label>
                        <input type="text" id="custName" required class="w-full bg-gray-50 border border-gray-300 rounded-lg py-2.5 px-3 text-sm focus:outline-none focus:border-red-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">شماره تماس</label>
                        <input type="tel" id="custPhone" required class="w-full bg-gray-50 border border-gray-300 rounded-lg py-2.5 px-3 text-sm focus:outline-none focus:border-red-500 focus:bg-white transition text-left" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">آدرس دقیق</label>
                        <textarea id="custAddress" required rows="2" class="w-full bg-gray-50 border border-gray-300 rounded-lg py-2.5 px-3 text-sm focus:outline-none focus:border-red-500 focus:bg-white transition"></textarea>
                    </div>
                </div>
                <button type="submit" class="mt-6 w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-xl"></i> ثبت سفارش و ارسال به واتساپ
                </button>
            </form>
        </div>
    </div>

    <footer class="bg-white border-t py-8 mt-10 text-center text-sm text-gray-500">
        <p>© ۱۴۰۳ داروخانه آنلاین - تمامی حقوق محفوظ است.</p>
    </footer>

    <script>
        // تابع تولید عکس با آیکون‌های گرافیکی (بدون نیاز به اینترنت خارجی)
        function getImg(icon) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
                <rect width="400" height="400" fill="#f8f9fa"/>
                <text x="200" y="240" font-size="150" text-anchor="middle" fill="#dc2626">${icon}</text>
            </svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        // لیست محصولات دارویی
        const products = [
            { id: 1, title: 'قرص ویتامین C 1000', price: 120000, old: 150000, rating: 4.8, reviews: 320, icon: "💊" },
            { id: 2, title: 'شربت تقویتی آهن', price: 85000, old: 95000, rating: 4.6, reviews: 180, icon: "🧪" },
            { id: 3, title: 'کپسول امگا 3 خالص', price: 250000, old: 300000, rating: 4.9, reviews: 450, icon: "💊" },
            { id: 4, title: 'ماسک صورت آبرسان', price: 45000, old: 60000, rating: 4.4, reviews: 210, icon: "🧴" },
            { id: 5, title: 'مسکن استامینوفن', price: 15000, old: 20000, rating: 4.8, reviews: 900, icon: "💊" },
            { id: 6, title: 'پماد سوختگی', price: 55000, old: 70000, rating: 4.7, reviews: 150, icon: "🧴" },
            { id: 7, title: 'قطره چشمی اشک مصنوعی', price: 35000, old: 45000, rating: 4.5, reviews: 320, icon: "💧" },
            { id: 8, title: 'دستکش یکبار مصرف (۱۰ عددی)', price: 25000, old: 30000, rating: 4.2, reviews: 110, icon: "🧤" },
            { id: 9, title: 'ماسک سه لایه (۵۰ عددی)', price: 80000, old: 100000, rating: 4.8, reviews: 650, icon: "😷" },
            { id: 10, title: 'الکل ضدعفونی کننده ۷۰٪', price: 40000, old: 50000, rating: 4.6, reviews: 400, icon: "🧴" },
            { id: 11, title: 'قرص مولتی ویتامین مینرال', price: 180000, old: 210000, rating: 4.7, reviews: 280, icon: "💊" },
            { id: 12, title: 'کرم ضد آفتاب SPF 50', price: 150000, old: 180000, rating: 4.9, reviews: 520, icon: "☀️" },
            { id: 13, title: 'شامپو ضد شوره', price: 95000, old: 110000, rating: 4.5, reviews: 190, icon: "🧴" },
            { id: 14, title: 'خمیر دندان گیاهی', price: 35000, old: 42000, rating: 4.3, reviews: 150, icon: "🪥" },
            { id: 15, title: 'دستمال کاغذی جیبی (۱۰ بسته)', price: 30000, old: 38000, rating: 4.1, reviews: 80, icon: "🧻" },
            { id: 16, title: 'دستگاه تست قند خون', price: 450000, old: 500000, rating: 4.8, reviews: 130, icon: "🩸" }
        ];

        let cart = [];

        function formatPrice(price) { return new Intl.NumberFormat('fa-IR').format(price) + ' تومان'; }
        function toPersianDigits(n) { return n.toString().replace(/\d/g, x => '۰۱۲۳۴۵۶۷۸۹'[x]); }

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            if(items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500"><i class="fa-solid fa-box-open text-4xl mb-3 block"></i>محصولی یافت نشد.</div>`;
                return;
            }
            grid.innerHTML = items.map(p => {
                const discount = Math.round(((p.old - p.price) / p.old) * 100);
                const imgData = getImg(p.icon);
                return `
                    <div class="bg-white rounded-2xl overflow-hidden hover:shadow-xl transition flex flex-col justify-between border border-gray-100 group">
                        <div class="relative overflow-hidden aspect-square bg-gray-50">
                            <img src="${imgData}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            ${discount > 0 ? `<span class="absolute top-2 right-2 bg-red-600 text-white text-xs font-bold px-2 py-1 rounded-lg">${toPersianDigits(discount)}٪</span>` : ''}
                        </div>
                        <div class="p-4 flex flex-col flex-1 justify-between">
                            <div>
                                <h3 class="text-sm font-bold text-gray-800 line-clamp-2 h-10 leading-5 mb-2">${p.title}</h3>
                                <div class="flex items-center gap-1 text-xs text-amber-500 font-semibold mb-2">
                                    <i class="fa-solid fa-star"></i>
                                    <span>${toPersianDigits(p.rating)}</span>
                                    <span class="text-gray-400">(${toPersianDigits(p.reviews)})</span>
                                </div>
                            </div>
                            <div>
                                ${p.old > p.price ? `<span class="text-xs text-gray-400 line-through block">${formatPrice(p.old)}</span>` : ''}
                                <span class="text-base font-extrabold text-gray-800">${formatPrice(p.price)}</span>
                                <button onclick="addToCart(${p.id})" class="mt-3 w-full bg-red-50 hover:bg-red-600 hover:text-white text-red-600 font-bold py-2 rounded-xl text-sm transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-plus text-xs"></i> افزودن به سبد
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = products.filter(p => p.title.toLowerCase().includes(q));
            renderProducts(filtered);
        }

        function toggleCart(open = null) {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('cartOverlay');
            const panel = document.getElementById('cartPanel');
            const isOpening = open !== null ? open : drawer.classList.contains('invisible');

            if (isOpening) {
                drawer.classList.remove('invisible');
                setTimeout(() => {
                    overlay.classList.add('opacity-100');
                    panel.classList.remove('-translate-x-full');
                }, 10);
            } else {
                overlay.classList.remove('opacity-100');
                panel.classList.add('-translate-x-full');
                setTimeout(() => {
                    drawer.classList.add('invisible');
                }, 300);
            }
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const item = cart.find(c => c.id === id);
            if (item) item.quantity++;
            else cart.push({ ...product, quantity: 1 });
            updateCartUI();
            toggleCart(true);
        }

        function updateQuantity(id, change) {
            const item = cart.find(c => c.id === id);
            if (!item) return;
            item.quantity += change;
            if (item.quantity <= 0) cart = cart.filter(c => c.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const cartItemsContainer = document.getElementById('cartItems');
            const totalPriceEl = document.getElementById('cartTotalPrice');
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            if (totalCount > 0) {
                badge.textContent = toPersianDigits(totalCount);
                badge.classList.remove('hidden');
                badge.classList.add('flex');
            } else {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }
            totalPriceEl.textContent = formatPrice(totalPrice);

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<div class="text-center text-gray-400 py-10"><i class="fa-solid fa-cart-arrow-down text-4xl mb-3 block"></i>سبد خرید خالی است.</div>`;
                return;
            }

            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="flex items-center gap-3 border-b border-gray-100 pb-3">
                    <div class="w-12 h-12 rounded-lg flex items-center justify-center bg-red-50 text-2xl">${item.icon}</div>
                    <div class="flex-1">
                        <h4 class="text-xs font-bold text-gray-800 line-clamp-1">${item.title}</h4>
                        <span class="text-xs text-red-600 font-semibold block mt-1">${formatPrice(item.price)}</span>
                    </div>
                    <div class="flex items-center gap-2 bg-gray-50 rounded-lg p-1 border border-gray-200">
                        <button onclick="updateQuantity(${item.id}, 1)" class="w-6 h-6 text-red-600 font-bold">+</button>
                        <span class="text-xs font-bold">${toPersianDigits(item.quantity)}</span>
                        <button onclick="updateQuantity(${item.id}, -1)" class="w-6 h-6 text-gray-500">-</button>
                    </div>
                </div>
            `).join('');
        }

        // --- بخش ارسال سفارش ---
        function openCheckout() {
            if (cart.length === 0) return alert('سبد خرید شما خالی است!');
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        function submitOrder(e) {
            e.preventDefault();
            
            // ⚠️ شماره واتساپ خودت رو اینجا بذار (با 98 شروع بشه و بدون صفر)
            // مثلا: 989121234567
            const myWhatsAppNumber = "989123456789"; 
            
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            
            // ساخت متن سفارش
            let orderText = `🛒 *سفارش جدید از داروخانه آنلاین*\n\n`;
            orderText += `👤 *نام مشتری:* ${name}\n`;
            orderText += `📞 *شماره تماس:* ${phone}\n`;
            orderText += `📍 *آدرس:* ${address}\n\n`;
            orderText += `📦 *لیست اقلام:* \n`;
            
            cart.forEach((item, index) => {
                orderText += `${index + 1}. ${item.title} (${item.quantity} عدد) - ${formatPrice(item.price * item.quantity)}\n`;
            });
            
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            orderText += `\n💰 *جمع کل:* ${formatPrice(totalPrice)}`;

            // هدایت به واتساپ
            const whatsappUrl = `https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(orderText)}`;
            window.open(whatsappUrl, '_blank');

            // پاک کردن سبد خرید و بستن مودال
            alert('سفارش شما آماده شد. در حال انتقال به واتساپ...');
            cart = [];
            updateCartUI();
            closeCheckout();
            toggleCart(false);
        }

        // اجرای اولیه
        renderProducts(products);
    </script>
</body>
</html>
